<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>📻 Porto - Lesmutatie</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <!-- STIJLEN (identiek, we laten ze weg voor de leesbaarheid, maar ze moeten blijven) -->
    <style>
        /* ... alle stijlen zoals eerder ... */
    </style>
</head>
<body>
    <!-- HTML (identiek) -->
    <div id="app">
        <!-- LOGIN SCHERM -->
        <div id="loginScreen" class="container">
            <h1>📻 Porto Lesmutatie</h1>
            <p class="sub">Simulatie: informatie ophalen en mutatie opmaken</p>
            <div class="form-group">
                <label>👤 Jouw naam</label>
                <input type="text" id="usernameInput" placeholder="Bijv. Jan" />
            </div>
            <div class="form-group">
                <label>🏫 Klas</label>
                <select id="classSelect">
                    <option value="ALPHA">ALPHA</option>
                    <option value="BRAVO">BRAVO</option>
                    <option value="CHARLIE">CHARLIE</option>
                    <option value="DELTA">DELTA</option>
                    <option value="ECHO">ECHO</option>
                    <option value="FOXTROT">FOXTROT</option>
                    <option value="GOLF">GOLF</option>
                    <option value="HOTEL">HOTEL</option>
                </select>
            </div>
            <button class="btn btn-success" id="connectBtn">🔗 Verbinden</button>
            <div id="loginError" class="error"></div>
            <!-- Instructieblok (identiek) -->
            <div class="instructie-blok">...</div>
        </div>
        <!-- HOOFDSCHERM (identiek) -->
        <div id="mainScreen" class="hidden">...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, onDisconnect, serverTimestamp, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = { /* ... */ };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ----- 5 SCENARIO'S (identiek) -----
        const SCENARIOS = [ /* ... volledige lijst ... */ ];

        // ----- HULPFUNCTIES -----
        function getCaseRef() { return ref(db, `cases/${myClass}`); }
        function getMutatieRef() { return ref(db, `mutaties/${myClass}`); }

        // ----- DOM REFS (identiek) -----
        const $ = id => document.getElementById(id);
        // ... alle $ variables ...

        // ----- STATE (identiek) -----
        // ...

        // ----- FUNCTIES (identiek, behalve connectToRoom) -----

        // ----- ROLTOEWIJZING -----
        async function assignRole() {
            const peersRef = ref(db, `porto_peers/${myClass}`);
            const snapshot = await new Promise(resolve => onValue(peersRef, resolve, { onlyOnce: true }));
            const data = snapshot.val();
            const count = data ? Object.keys(data).length : 0;
            let role;
            if (count === 0) role = 'Burger';
            else if (count === 1) role = 'Collega1';
            else if (count === 2) role = 'Collega2';
            else role = 'Meldkamer';
            const isAdmin = (count === 3);
            return { role, isAdmin };
        }

        // ----- CASUS BEHEER (loadCase, nextCase) -----
        function loadCase(index) {
            if (index >= SCENARIOS.length) {
                currentScenario = null;
                currentCaseName.textContent = 'Alle casussen afgerond! 🎉';
                updateRoleInfo();
                return;
            }
            currentScenario = SCENARIOS[index];
            currentCaseName.textContent = currentScenario.naam;
            updateRoleInfo();
            // Reset mutatieformulier
            mutWie.value = mutWat.value = mutWaar.value = mutWaarmee.value = mutWijze.value = mutWaarom.value = '';
            mutWanneer.value = '';
            saveIndicator.textContent = '';
            if (myRole === 'Meldkamer') {
                addChat('📢', `Nieuwe casus gestart: ${currentScenario.naam}. Begin met het uitvragen van de 7 W's.`, true);
            } else {
                addChat('📢', `Nieuwe casus: ${currentScenario.naam}. Bereid je voor op de simulatie.`, true);
            }
            const caseRef = getCaseRef();
            set(caseRef, {
                index: index,
                scenarioId: currentScenario.id,
                naam: currentScenario.naam,
                timestamp: serverTimestamp()
            });
        }

        function nextCase() {
            if (!isAdmin) return;
            currentCaseIndex++;
            loadCase(currentCaseIndex);
            livefeedContainer.innerHTML = '<div class="empty-state">⏳ Wachten op mutatie...</div>';
            const mutRef = getMutatieRef();
            remove(mutRef);
        }

        // ----- ROLINFO WEERGEVEN (aangepast: fallback als currentScenario null is) -----
        function updateRoleInfo() {
            if (!currentScenario) {
                myRoleInfo.textContent = 'Geen actieve casus. Wacht op de docent.';
                otherRolesInfo.innerHTML = '';
                return;
            }
            const roles = currentScenario.rollen;
            const myInfo = roles[myRole] ? roles[myRole].info : 'Geen informatie voor deze rol.';
            myRoleInfo.textContent = myInfo;

            let otherHtml = '';
            for (let [rol, data] of Object.entries(roles)) {
                if (rol === myRole) continue;
                otherHtml += `<div class="rolinfo"><span class="label">${rol}:</span><div class="content">[informatie alleen zichtbaar voor ${rol}]</div></div>`;
            }
            otherRolesInfo.innerHTML = otherHtml || '<div class="rolinfo">Geen andere rollen.</div>';
        }

        // ----- HOOFDFUNCTIE (verbinden) - AANGEPAST -----
        async function connectToRoom() {
            const username = usernameInput.value.trim();
            const klas = classSelect.value;
            if (!username) {
                loginError.textContent = 'Vul je naam in.';
                return;
            }
            if (klas === 'INDIE') {
                loginError.textContent = 'Kies een geldige klas.';
                return;
            }

            myUsername = username;
            myClass = klas;
            myId = generateId();

            // Rol toewijzen
            const { role, isAdmin: admin } = await assignRole();
            myRole = role;
            isAdmin = admin;

            // Zet direct de eerste casus (zodat rolinfo getoond wordt)
            currentCaseIndex = 0;
            currentScenario = SCENARIOS[0]; // Neem de eerste casus
            // Als er al een casus in Firebase staat, wordt die later overschreven, maar voor nu hebben we info.

            displayName.textContent = myUsername;
            roleDisplay.textContent = myRole;
            if (myRole === 'Burger') {
                roleDisplay.style.background = '#6c757d';
            } else if (myRole === 'Meldkamer') {
                roleDisplay.style.background = '#f0c040';
                roleDisplay.style.color = '#1a2332';
            } else {
                roleDisplay.style.background = '#28a745';
            }

            loginScreen.classList.add('hidden');
            mainScreen.classList.remove('hidden');

            // Mutatie-tab alleen voor Meldkamer
            const mutatieTab = document.querySelector('[data-tab="tab-mutatie"]');
            if (myRole === 'Meldkamer') {
                mutatieTab.style.display = 'block';
            } else {
                mutatieTab.style.display = 'none';
            }

            // Admin krijgt de "Volgende casus" knop
            if (isAdmin) {
                nextCaseBtn.style.display = 'block';
                nextCaseBtn.onclick = nextCase;
            } else {
                nextCaseBtn.style.display = 'none';
            }

            feedKlas.textContent = myClass;
            loadLivefeed();

            // Toon meteen de rolinfo (zonder te wachten op Firebase)
            currentCaseName.textContent = currentScenario.naam;
            updateRoleInfo();

            // Luister naar actieve casus in Firebase (dit overschrijft later de lokale instelling)
            const caseRef = getCaseRef();
            if (caseUnsubscribe) caseUnsubscribe();
            caseUnsubscribe = onValue(caseRef, (snapshot) => {
                const data = snapshot.val();
                if (data && data.index !== undefined) {
                    currentCaseIndex = data.index;
                    const scenario = SCENARIOS[currentCaseIndex];
                    if (scenario) {
                        currentScenario = scenario;
                        currentCaseName.textContent = scenario.naam;
                        updateRoleInfo();
                    } else {
                        currentScenario = null;
                        currentCaseName.textContent = 'Alle casussen afgerond! 🎉';
                        updateRoleInfo();
                    }
                } else {
                    // Geen actieve casus in Firebase, start bij 0
                    currentCaseIndex = 0;
                    loadCase(0);
                }
            });

            setStatus('connecting', 'Verbinden...');

            // PeerJS opzetten
            peer = new Peer(myId);
            peer.on('open', () => {
                isConnected = true;
                setStatus('online', 'Online');
                chatInput.disabled = false;
                chatSendBtn.disabled = false;
                addChat('📡', 'Je bent verbonden met de porto!', true);
                startPeerDiscovery();
                initMicrophone();
            });

            peer.on('connection', (conn) => {
                if (conn.peer !== myId) {
                    setupDataConnection(conn);
                } else {
                    conn.close();
                }
            });

            peer.on('call', (call) => {
                if (!localStream || !microEnabled) { call.answer(); return; }
                call.answer(localStream);
                call.on('stream', (remoteStream) => {
                    const audio = document.createElement('audio');
                    audio.autoplay = true;
                    audio.srcObject = remoteStream;
                    audio.volume = 1.0;
                    audio.muted = false;
                    document.body.appendChild(audio);
                    audioConnections.set(call.peer, { call, audio });
                });
                call.on('close', () => {
                    const entry = audioConnections.get(call.peer);
                    if (entry) {
                        entry.audio.remove();
                        audioConnections.delete(call.peer);
                    }
                });
            });

            peer.on('error', (err) => {
                console.error(err);
                if (err.type === 'unavailable-id') {
                    myId = generateId();
                    connectToRoom();
                } else {
                    addChat('❌ Fout', err.message, true);
                }
            });

            peer.on('disconnected', () => {
                addChat('⚠️', 'Verbinding verbroken, opnieuw verbinden...', true);
                setTimeout(() => {
                    if (peer) peer.destroy();
                    if (isConnected) connectToRoom();
                }, 2000);
            });
        }

        // ----- EVENT LISTENERS (identiek) -----
        // ...

        // Start
        loginScreen.classList.remove('hidden');
        mainScreen.classList.add('hidden');
    </script>
</body>
</html>
