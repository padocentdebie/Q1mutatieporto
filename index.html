<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>📻 Porto - Walkie Talkie</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0e17; color: #e0e0e0;
            padding: 16px; max-width: 600px; margin: 0 auto;
            min-height: 100vh;
        }
        .container {
            background: #1a2332; border-radius: 20px; padding: 20px;
            border: 2px solid #2a3a4a; box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            margin-bottom: 16px;
        }
        h1 { text-align: center; color: #f0c040; font-size: 1.4rem; }
        .sub { text-align: center; color: #8899aa; font-size: 0.85rem; margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: 600; font-size: 0.85rem; color: #aabbcc; margin-bottom: 4px; }
        input, select {
            width: 100%; padding: 10px 12px; border-radius: 10px;
            border: 2px solid #2a3a4a; background: #0d1624; color: #e0e0e0;
            font-size: 1rem;
        }
        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 12px;
            font-weight: 700; font-size: 1rem; cursor: pointer;
            transition: all 0.2s; margin-top: 8px;
        }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin: 8px 0;
        }
        .status-led {
            display: inline-block; width: 10px; height: 10px; border-radius: 50%;
            margin-right: 6px;
        }
        .status-led.online { background: #28a745; animation: pulse 1.5s infinite; }
        .status-led.offline { background: #dc3545; }
        .status-led.speaking { background: #f0c040; animation: pulse 0.3s infinite; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
        .user-list {
            display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px;
        }
        .chip {
            background: #0d1624; padding: 4px 10px; border-radius: 12px;
            font-size: 0.75rem; border: 1px solid #2a3a4a;
        }
        .ptt-btn {
            width: 100%; padding: 24px; border: none; border-radius: 16px;
            font-weight: 900; font-size: 1.5rem; cursor: pointer;
            background: #dc3545; color: white;
            touch-action: manipulation;
            box-shadow: 0 4px 0 #a71d2a;
            transition: all 0.05s;
        }
        .ptt-btn:active, .ptt-btn.active {
            background: #f0c040; color: #1a2332;
            transform: scale(0.97);
        }
        .chat-box {
            background: #0d1624; border-radius: 12px; padding: 10px;
            max-height: 150px; overflow-y: auto; border: 1px solid #2a3a4a;
            font-size: 0.85rem; margin: 8px 0;
        }
        .chat-input-row {
            display: flex; gap: 6px; margin-top: 8px;
        }
        .chat-input-row input {
            flex: 1; padding: 8px; border-radius: 10px;
            border: 2px solid #2a3a4a; background: #0d1624; color: #e0e0e0;
        }
        .chat-input-row button {
            padding: 8px 16px; border-radius: 10px; border: none;
            background: #4a90d9; color: white; cursor: pointer;
        }
        .hidden { display: none !important; }
        .error { color: #dc3545; font-size: 0.85rem; margin-top: 4px; }
        .micro-status {
            text-align: center; font-size: 0.8rem; padding: 4px 0;
            color: #8899aa;
        }
        .micro-status.ok { color: #28a745; }
        .micro-status.err { color: #dc3545; }
        .role-badge {
            display: inline-block; padding: 4px 10px; border-radius: 12px;
            font-size: 0.75rem; font-weight: bold;
            background: #4a90d9; color: white;
        }
        .info-text {
            color: #8899aa; font-size: 0.75rem; text-align: center; margin-top: 8px;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- LOGIN -->
    <div id="loginScreen" class="container">
        <h1>📻 Porto Training</h1>
        <p class="sub">Walkie Talkie voor de opleiding</p>
        <div class="form-group">
            <label>👤 Jouw naam</label>
            <input type="text" id="usernameInput" placeholder="Bijv. Jan" />
        </div>
        <div class="form-group">
            <label>🏫 Klas</label>
            <select id="classSelect">
                <option value="ALPHA">ALPHA</option>
                <option value="BRAVO">BRAVO</option>
                <option value="CHARLIE">CHARLIE</option>
                <option value="DELTA">DELTA</option>
                <option value="ECHO">ECHO</option>
                <option value="FOXTROT">FOXTROT</option>
                <option value="GOLF">GOLF</option>
                <option value="HOTEL">HOTEL</option>
            </select>
        </div>
        <button class="btn btn-success" id="connectBtn">🔗 Verbinden</button>
        <div id="loginError" class="error"></div>
        <div class="info-text">Iedereen krijgt automatisch een rol.<br>Houd de knop ingedrukt om te spreken.</div>
    </div>

    <!-- PORTO SCHERM -->
    <div id="portoScreen" class="hidden">
        <div class="container">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-weight:bold; color:#f0c040;" id="displayName">-</span>
                <span id="roleDisplay" class="role-badge">Rol</span>
            </div>
            <div class="status-bar">
                <span>
                    <span class="status-led offline" id="statusLed"></span>
                    <span id="statusText">Niet verbonden</span>
                </span>
                <span id="userCount" style="font-size:0.8rem;">👥 0</span>
            </div>
            <div class="user-list" id="userList"><span style="color:#667788;">Verbinden...</span></div>
            <div class="micro-status" id="microStatus">⏳ Microfoon starten...</div>

            <button class="ptt-btn" id="pttButton" disabled>🎤 HOU IN</button>
            <div style="text-align:center; font-size:0.8rem; color:#8899aa; margin-top:4px;">Ingedrukt houden om te spreken</div>

            <div class="chat-box" id="chatMessages"><div style="color:#667788; text-align:center;">Porto-berichten</div></div>
            <div class="chat-input-row">
                <input type="text" id="chatInput" placeholder="Typ een bericht..." disabled />
                <button id="chatSendBtn" disabled>📨</button>
            </div>

            <button class="btn btn-danger" id="disconnectBtn" style="margin-top:10px;">🚪 Verbinding verbreken</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBOo2LzR1IBnsiBR2SCwPJABtaRv0tpKQ4",
        authDomain: "speeltuin-recherche.firebaseapp.com",
        databaseURL: "https://speeltuin-recherche-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "speeltuin-recherche",
        storageBucket: "speeltuin-recherche.firebasestorage.app",
        messagingSenderId: "499912834123",
        appId: "1:499912834123:web:3c84cbf4d5eb13131961ce"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ----- Rollen (eenvoudig) -----
    const SCENARIOS = {
        "ALPHA": { rollen: ["Agent", "Verdachte", "Getuige", "OC"] },
        "BRAVO": { rollen: ["Agent", "Slachtoffer", "Getuige", "OC"] },
        "CHARLIE": { rollen: ["Commandant", "Verdachte", "Slachtoffer", "OC"] },
        "DELTA": { rollen: ["Agent", "AangeslotenCollega", "Getuige", "OC"] },
        "ECHO": { rollen: ["Agent", "AangeslotenKoppel", "Verdachte", "OC"] },
        "FOXTROT": { rollen: ["Commandant", "AangeslotenCollega", "Slachtoffer", "OC"] },
        "GOLF": { rollen: ["Agent", "Verdachte", "Getuige", "Commandant"] },
        "HOTEL": { rollen: ["OC", "Agent", "Verdachte", "Slachtoffer"] }
    };

    function hashString(s) {
        let h = 0;
        for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
        return h;
    }

    function getRole(klas, username) {
        const roles = SCENARIOS[klas]?.rollen || ["Agent", "Verdachte", "Getuige", "OC"];
        const idx = hashString(klas + username) % roles.length;
        return roles[idx];
    }

    // ----- DOM refs -----
    const $ = id => document.getElementById(id);
    const loginScreen = $('loginScreen');
    const portoScreen = $('portoScreen');
    const usernameInput = $('usernameInput');
    const classSelect = $('classSelect');
    const connectBtn = $('connectBtn');
    const loginError = $('loginError');
    const displayName = $('displayName');
    const roleDisplay = $('roleDisplay');
    const statusLed = $('statusLed');
    const statusText = $('statusText');
    const userCount = $('userCount');
    const userList = $('userList');
    const microStatus = $('microStatus');
    const pttButton = $('pttButton');
    const chatMessages = $('chatMessages');
    const chatInput = $('chatInput');
    const chatSendBtn = $('chatSendBtn');
    const disconnectBtn = $('disconnectBtn');

    // ----- State -----
    let peer = null;
    let localStream = null;
    let isSpeaking = false;
    let isConnected = false;
    let myUsername = '';
    let myClass = '';
    let myRole = '';
    let myId = '';
    const connections = new Set();          // peerId
    const dataConnections = new Map();     // peerId -> DataConnection
    const audioConnections = new Map();    // peerId -> { call, audio }
    let peerListUnsubscribe = null;
    let peersRef = null;
    let microEnabled = false;

    function generateId() {
        return 'P-' + Math.random().toString(36).substr(2, 8);
    }

    function setStatus(state, text) {
        const ledMap = { online: 'online', offline: 'offline', speaking: 'speaking' };
        statusLed.className = 'status-led ' + (ledMap[state] || 'offline');
        statusText.textContent = text || state;
    }

    function addChat(sender, text, system = false) {
        const div = document.createElement('div');
        div.style.marginBottom = '4px';
        div.style.fontSize = '0.85rem';
        if (system) {
            div.style.color = '#8899aa';
            div.innerHTML = `<em>${sender}:</em> ${text}`;
        } else {
            div.innerHTML = `<strong style="color:#f0c040;">${sender}</strong> ${text}`;
        }
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function updateUserList() {
        userCount.textContent = `👥 ${connections.size}`;
        let html = `<span class="chip" style="border-color:#f0c040;">📡 ${myId} (Jij)</span>`;
        for (let id of connections) {
            html += `<span class="chip">📞 ${id}</span>`;
        }
        userList.innerHTML = html || '<span style="color:#667788;">Niemand anders in deze klas</span>';
    }

    // ----- Microfoon (altijd activeren) -----
    async function initMicrophone() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, echoCancellation: true, noiseSuppression: true });
            localStream.getAudioTracks().forEach(t => t.enabled = false);
            microEnabled = true;
            microStatus.textContent = '✅ Microfoon gereed';
            microStatus.className = 'micro-status ok';
            return true;
        } catch (err) {
            microEnabled = false;
            microStatus.textContent = '❌ Geen microfoontoegang - gebruik alleen chat';
            microStatus.className = 'micro-status err';
            return false;
        }
    }

    // ----- PTT -----
    function startSpeaking() {
        if (!isConnected || !microEnabled || isSpeaking) return;
        isSpeaking = true;
        pttButton.classList.add('active');
        pttButton.textContent = '🔴 SPREEKT...';
        setStatus('speaking', 'Spreekt...');
        if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = true);
    }

    function stopSpeaking() {
        if (!isSpeaking) return;
        isSpeaking = false;
        pttButton.classList.remove('active');
        pttButton.textContent = '🎤 HOU IN';
        setStatus('online', 'Online');
        if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = false);
    }

    // ----- Audio oproep (altijd opzetten) -----
    function callPeer(peerId) {
        if (!localStream) return;
        if (audioConnections.has(peerId)) return;
        const call = peer.call(peerId, localStream);
        call.on('stream', (remoteStream) => {
            const audio = document.createElement('audio');
            audio.autoplay = true;
            audio.srcObject = remoteStream;
            audio.volume = 1.0;
            audio.muted = false;
            document.body.appendChild(audio);
            audioConnections.set(peerId, { call, audio });
        });
        call.on('close', () => {
            const entry = audioConnections.get(peerId);
            if (entry) {
                entry.audio.remove();
                audioConnections.delete(peerId);
            }
        });
    }

    // ----- Data verbinding -----
    function setupDataConnection(conn) {
        const peerId = conn.peer;
        if (connections.has(peerId)) {
            conn.close();
            return;
        }

        conn.on('open', () => {
            connections.add(peerId);
            dataConnections.set(peerId, conn);
            conn.send({ type: 'hello', username: myUsername, role: myRole, class: myClass });
            // Audio altijd opzetten (als microfoon beschikbaar)
            if (localStream) callPeer(peerId);
            updateUserList();
            addChat('🔗', `${peerId} is verbonden`, true);
        });

        conn.on('data', (data) => {
            if (data.class && data.class !== myClass) return;
            if (data.type === 'hello') {
                // We hebben al een verbinding; geen actie nodig
                return;
            }
            if (data.type === 'chat') {
                addChat(`${data.sender} (${data.role})`, data.text);
            }
        });

        conn.on('close', () => {
            connections.delete(peerId);
            dataConnections.delete(peerId);
            const entry = audioConnections.get(peerId);
            if (entry) {
                entry.call.close();
                entry.audio.remove();
                audioConnections.delete(peerId);
            }
            updateUserList();
            addChat('🔌', `${peerId} is verbroken`, true);
        });
    }

    // ----- Peer discovery via Firebase -----
    function startPeerDiscovery() {
        peersRef = ref(db, `porto_peers/${myClass}`);
        const myPeerRef = ref(db, `porto_peers/${myClass}/${myId}`);
        set(myPeerRef, {
            username: myUsername,
            role: myRole,
            timestamp: serverTimestamp()
        });
        onDisconnect(myPeerRef).remove();

        if (peerListUnsubscribe) peerListUnsubscribe();
        peerListUnsubscribe = onValue(peersRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            const ids = Object.keys(data);
            for (let id of ids) {
                if (id === myId) continue;
                if (!connections.has(id)) {
                    const conn = peer.connect(id);
                    if (conn) {
                        setupDataConnection(conn);
                    } else {
                        console.warn('Kan niet verbinden met', id);
                    }
                }
            }
        });
    }

    // ----- Hoofdfunctie -----
    async function connectToRoom() {
        const username = usernameInput.value.trim();
        const klas = classSelect.value;
        if (!username) {
            loginError.textContent = 'Vul je naam in.';
            return;
        }
        if (klas === 'INDIE') {
            loginError.textContent = 'Kies een geldige klas.';
            return;
        }

        myUsername = username;
        myClass = klas;
        myRole = getRole(klas, username);
        myId = generateId();

        displayName.textContent = myUsername;
        roleDisplay.textContent = myRole;
        if (['Agent','Commandant','AangeslotenCollega','AangeslotenKoppel'].includes(myRole)) {
            roleDisplay.style.background = '#28a745';
        } else if (myRole === 'OC') {
            roleDisplay.style.background = '#f0c040';
            roleDisplay.style.color = '#1a2332';
        } else {
            roleDisplay.style.background = '#dc3545';
        }

        loginScreen.classList.add('hidden');
        portoScreen.classList.remove('hidden');
        setStatus('connecting', 'Verbinden...');

        // Microfoon altijd proberen
        const micOk = await initMicrophone();

        peer = new Peer(myId);
        peer.on('open', () => {
            isConnected = true;
            setStatus('online', 'Online');
            chatInput.disabled = false;
            chatSendBtn.disabled = false;
            if (microEnabled) {
                pttButton.disabled = false;
            } else {
                pttButton.disabled = true;
                // Toch chatten mogelijk
            }
            addChat('📡', 'Je bent verbonden met de porto!', true);
            startPeerDiscovery();
        });

        peer.on('connection', (conn) => {
            if (conn.peer !== myId) {
                setupDataConnection(conn);
            } else {
                conn.close();
            }
        });

        peer.on('call', (call) => {
            if (!localStream) { call.answer(); return; }
            call.answer(localStream);
            call.on('stream', (remoteStream) => {
                const audio = document.createElement('audio');
                audio.autoplay = true;
                audio.srcObject = remoteStream;
                audio.volume = 1.0;
                audio.muted = false;
                document.body.appendChild(audio);
                audioConnections.set(call.peer, { call, audio });
            });
            call.on('close', () => {
                const entry = audioConnections.get(call.peer);
                if (entry) {
                    entry.audio.remove();
                    audioConnections.delete(call.peer);
                }
            });
        });

        peer.on('error', (err) => {
            console.error(err);
            if (err.type === 'unavailable-id') {
                myId = generateId();
                connectToRoom();
            } else {
                addChat('❌ Fout', err.message, true);
            }
        });

        peer.on('disconnected', () => {
            addChat('⚠️', 'Verbinding verbroken, opnieuw verbinden...', true);
            setTimeout(() => {
                if (peer) peer.destroy();
                if (isConnected) connectToRoom();
            }, 2000);
        });
    }

    // ----- Event listeners -----
    connectBtn.addEventListener('click', connectToRoom);

    pttButton.addEventListener('mousedown', startSpeaking);
    pttButton.addEventListener('mouseup', stopSpeaking);
    pttButton.addEventListener('mouseleave', stopSpeaking);
    pttButton.addEventListener('touchstart', (e) => { e.preventDefault(); startSpeaking(); });
    pttButton.addEventListener('touchend', (e) => { e.preventDefault(); stopSpeaking(); });

    chatSendBtn.addEventListener('click', () => {
        const text = chatInput.value.trim();
        if (!text) return;
        const data = { type: 'chat', sender: myUsername, role: myRole, class: myClass, text };
        for (let conn of dataConnections.values()) {
            try { conn.send(data); } catch(e) {}
        }
        addChat(`📤 ${myUsername} (${myRole})`, text);
        chatInput.value = '';
    });
    chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') chatSendBtn.click(); });

    disconnectBtn.addEventListener('click', () => {
        if (peer) peer.destroy();
        connections.clear();
        dataConnections.clear();
        for (let entry of audioConnections.values()) {
            entry.call.close();
            entry.audio.remove();
        }
        audioConnections.clear();
        isConnected = false;
        if (peerListUnsubscribe) peerListUnsubscribe();
        if (peersRef) {
            const myPeerRef = ref(db, `porto_peers/${myClass}/${myId}`);
            remove(myPeerRef);
        }
        loginScreen.classList.remove('hidden');
        portoScreen.classList.add('hidden');
        setStatus('offline', 'Offline');
        chatInput.disabled = true;
        chatSendBtn.disabled = true;
        pttButton.disabled = true;
        pttButton.classList.remove('active');
        pttButton.textContent = '🎤 HOU IN';
        if (localStream) {
            localStream.getTracks().forEach(t => t.stop());
            localStream = null;
        }
        microEnabled = false;
        microStatus.textContent = '⏳ Microfoon gestopt';
        microStatus.className = 'micro-status';
    });

    // Start
    loginScreen.classList.remove('hidden');
    portoScreen.classList.add('hidden');
</script>
</body>
</html>
